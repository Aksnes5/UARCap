# Pilot A2 (3-Way Evaluator & Human Calibration) and Pilot A3 (Modern VLM + VidHalluc E3)
# Model Reuse Policy: Prioritize EXISTING models already deployed on BN (vLLM 0.29.0 / PyTorch 2.13.0+cu130 / CUDA 13.0).
# Do NOT download new models unless existing BN models fail scientific pilot verification.

e2_dataset: "carebench"

stage_a2:
  pilot_stage: "PILOT_A2"
  prerequisite_stage: "PILOT_A1"
  dataset_id: "CaReBench"
  n_calibration_videos: 30
  protocol_layer: "LAYER3_UARCAP_3WAY_REF_PROXY"
  human_reference_fields: ["caption", "spatial_caption", "temporal_caption"]
  llm_extracted_events_objects_not_human_gold: true
  opening_overview_core_event_candidate_requires_pilot_audit: true
  candidate_cross_family_judges:
    # Final judge is NOT frozen before Pilot A2 calibration! All candidates reuse EXISTING BN models.
    - model_id: "mistralai/Mistral-Small-3.2-24B-Instruct-2506"
      display_name: "Mistral Small 3.2 24B"
      model_family: "mistral"
      already_on_bn: true
      priority: 1
    - model_id: "google/gemma-3-27b-it"
      display_name: "Gemma 3 27B"
      model_family: "gemma"
      already_on_bn: true
      priority: 2
    - model_id: "meta-llama/Llama-3.3-70B-Instruct-W4A16"
      display_name: "Llama 3.3 70B W4A16"
      model_family: "llama"
      already_on_bn: true
      priority: 3
    - model_id: "openai/gpt-oss-20b"
      display_name: "gpt-oss-20b"
      model_family: "gpt_oss"
      already_on_bn: true
      priority: 4
    - model_id: "microsoft/phi-4"
      display_name: "Phi-4 14B"
      model_family: "phi"
      already_on_bn: true
      priority: 5
    - model_id: "meta-llama/Llama-3.1-8B-Instruct"
      display_name: "Llama 3.1 8B"
      model_family: "llama"
      already_on_bn: true
      priority: 6
  max_prompt_calibration_rounds: 2
  redlines:
    min_prec_contra_to_err: 0.65
    min_paired_delta_spearman_rho: 0.45
    max_directional_reversal_rate: 0.20
    max_a7_recall_drop_vs_a0: 0.15
    max_a7_unment_leak_increase_vs_a0: 0.10
    max_a7_underestimation_ratio: 0.40
  human_annotation:
    annotators: ["A1", "A2"]
    blind_muted_video: true
    phase1_core_event_lock: true
    min_inter_annotator_agreement: 0.70

stage_a3:
  pilot_stage: "PILOT_A3"
  prerequisite_stage: "PILOT_A2"
  modern_vlm_candidates:
    # Primary: Existing BN Qwen3.8-27B-FP8 (66/66 shards, 30.89 GB, native video support via vLLM 0.29.0)
    # Backup: Existing BN Qwen3.5-27B. Qwen2.5-VL-7B-Instruct default download CANCELLED!
    - model_id: "Qwen/Qwen3.8-27B-FP8"
      local_model_path: "/media/bn/37b77782-9321-42a0-8a20-f53b4ec9179d1/xyl/Jnh_rag/models/Qwen3.8-27B-FP8"
      model_family: "qwen"
      already_on_bn: true
      backend_mode: "vllm_subprocess"
      quantization: "fp8"
      num_frames: 16
      prompt_regime: "short_aligned"
      max_new_tokens: 48
      enable_thinking: false
      priority: 1
    - model_id: "Qwen/Qwen3.5-27B"
      model_family: "qwen"
      already_on_bn: true
      backend_mode: "vllm_subprocess"
      num_frames: 16
      prompt_regime: "short_aligned"
      max_new_tokens: 48
      enable_thinking: false
      priority: 2
  e2_cross_model_check:
    dataset_id: "CaReBench"
    n_videos: 30
    arms: ["ARM_A0", "ARM_A1", "ARM_A7"]
    max_cross_model_recall_gap: 0.20
  vidhalluc_e3_pilot:
    dataset_id: "VidHalluc-ACH"
    archive_verified_bytes: 16754119398
    license: "cc-by-nc-nd-4.0"
    candidate_pool_size: 30
    target_approved_clips: 20
    min_applicability_pass_rate: 0.50
    arms: ["E3_BASE", "E3_SUP", "E3_CON", "E3_NEU"]
    base_visual_mode: "BASE_A0"
    endpoints: ["y_true", "y_conflict"]
    require_e3_human_verification: true
    e3_judge_min_accuracy: 0.80
    e3_judge_min_kappa: 0.80
    e3_judge_max_con_neu_bias: 0.15
    scientific_null_effect_is_not_failure: true
