# Isolated Environment 4: Lightweight CPU Data Processing, Annotation UI, & Statistical Analysis
# Runs identically on Windows laptop and Ubuntu BN server (zero CUDA dependencies).
name: uarcap_q2_cpu
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy>=1.26.0
      - scipy>=1.12.0
      - pillow>=10.0.0
      - av>=13.0.0
      - pyyaml>=6.0.1
      - pytest>=8.0.0
